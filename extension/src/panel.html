<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Launcher</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="banner" class="banner" hidden>
  ファイルURLへのアクセスが無効です。<code>chrome://extensions</code> の本拡張の詳細画面で
  「ファイルのURLへのアクセスを許可する」をONにしてください。
</div>

<header>
  <button id="addCurrent" class="primary">＋このファイルを登録</button>
  <button id="addAllTabs">開いている .md タブをすべて登録</button>
  <button id="openSide" title="サイドパネルで開く">サイドパネル</button>
</header>

<details id="pasteBox">
  <summary>パスを貼り付けて追加</summary>
  <textarea id="pasteText" rows="4" placeholder="/Users/me/docs/README.md&#10;file:///Users/me/notes/todo.md&#10;C:\docs\spec.md （1行1件）"></textarea>
  <button id="pasteAdd">追加</button>
</details>

<div id="status" class="status" role="status"></div>

<div class="filters">
  <input id="search" type="search" placeholder="検索（表示名・パス・タグ・メモ）">
  <select id="tagFilter"><option value="">すべてのタグ</option></select>
</div>

<ul id="list"></ul>
<p id="empty" class="empty" hidden>登録されたファイルはありません。</p>

<footer>
  <label><input type="checkbox" id="useViewer"> ビューアページで開く（.md がダウンロードされる環境向け）</label>
  <label>表示テーマ
    <select id="mdTheme">
      <option value="system">システムに従う</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select>
  </label>
</footer>

<script src="urlutil.js"></script>
<script src="panel.js"></script>
</body>
</html>
